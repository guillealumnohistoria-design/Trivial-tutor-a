<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Pursuit - Digitalización</title>
    <style>
        :root {
            --geo: #1e90ff; --arte: #ba55d3; --hist: #ffd700;
            --ent: #ff69b4; --cien: #32cd32; --dep: #ff4500;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .setup, .game-container { background: #34495e; padding: 20px; border-radius: 12px; max-width: 800px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        .tablero-digital { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .casilla { width: 90px; height: 90px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; position: relative; color: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .casilla.actual { border: 4px solid #fff; box-shadow: 0 0 15px #fff; }
        .ficha-equipo { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin: 2px; border: 1px solid #000; }
        .panel-equipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .tarjeta-equipo { background: #2c3e50; padding: 10px; border-radius: 8px; border-left: 5px solid #fff; }
        .tarjeta-equipo.activo { background: #16a085; transform: scale(1.05); }
        .quesito { width: 12px; height: 12px; display: inline-block; border-radius: 3px; margin: 2px; opacity: 0.2; }
        .quesito.obtenido { opacity: 1; }
        button { background: #e67e22; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d35400; }
        .dado-resultado { font-size: 48px; margin: 15px 0; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 30px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); width: 80%; max-width: 500px; z-index: 100; }
        .opcion-btn { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; background: #f0f0f0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .opcion-btn:hover { background: #e0e0e0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99; }
    </style>
</head>
<body>

    <h1>🧠 Trivial Pursuit Digitalization Edition</h1>

    <div id="setup" class="setup">
        <h3>Configuración de Partida</h3>
        <label for="numEquipos">Número de Equipos (2-4): </label>
        <input type="number" id="numEquipos" min="2" max="4" value="2" style="padding: 8px; font-size:16px; width: 50px;">
        <br><br>
        <button onclick="iniciarJuego()">Comenzar Partida</button>
    </div>

    <div id="gameContainer" class="game-container hidden">
        <div id="turnoAlerta">Es el turno del <strong>Equipo 1</strong></div>
        <div>
            <button id="btnDado" onclick="lanzarDado()">🎲 Lanzar Dado</button>
            <div id="dadoResult" class="dado-resultado">?</div>
        </div>
        <div class="tablero-digital" id="tablero"></div>
        <div class="panel-equipos" id="panelEquipos"></div>
    </div>

    <div id="overlay" class="overlay hidden"></div>
    <div id="modalPregunta" class="modal hidden">
        <h3 id="modalCategoria" style="margin-top:0;"></h3>
        <p id="modalTextoPregunta" style="font-size: 18px; font-weight: bold;"></p>
        <div id="modalOpciones"></div>
    </div>

    <script>
        const BANCO_PREGUNTAS = {
            "Geografía": [
                { q: "¿Cuál es el río más largo del mundo?", a: ["Amazonas", "Nilo", "Misisipi", "Danubio"], correcta: 0 },
                { q: "¿En qué país se encuentra la Torre Eiffel?", a: ["Italia", "Francia", "España", "Alemania"], correcta: 1 }
            ],
            "Arte y Literatura": [
                { q: "¿Quién pintó la Mona Lisa?", a: ["Van Gogh", "Da Vinci", "Picasso", "Velázquez"], correcta: 1 }
            ],
            "Historia": [
                { q: "¿En qué año llegó Cristóbal Colón a América?", a: ["1492", "1588", "1789", "1350"], correcta: 0 }
            ],
            "Entretenimiento": [
                { q: "¿Qué personaje vive en una piña debajo del mar?", a: ["Bob Esponja", "Patricio", "Calamardo", "Arenita"], correcta: 0 }
            ],
            "Ciencia y Naturaleza": [
                { q: "¿Cuál es el símbolo químico del agua?", a: ["CO2", "H2O", "O2", "H2"], correcta: 1 }
            ],
            "Deportes": [
                { q: "¿Cuántos jugadores tiene un equipo de fútbol en el campo?", a: ["11", "7", "9", "12"], correcta: 0 }
            ]
        };

        const CASILLAS = [
            { cat: "Geografía", color: "var(--geo)", quesito: true },
            { cat: "Entretenimiento", color: "var(--ent)", quesito: false },
            { cat: "Arte y Literatura", color: "var(--arte)", quesito: true },
            { cat: "Ciencia y Naturaleza", color: "var(--cien)", quesito: false },
            { cat: "Historia", color: "var(--hist)", quesito: true },
            { cat: "Deportes", color: "var(--dep)", quesito: false },
            { cat: "Entretenimiento", color: "var(--ent)", quesito: true },
            { cat: "Geografía", color: "var(--geo)", quesito: false },
            { cat: "Ciencia y Naturaleza", color: "var(--cien)", quesito: true },
            { cat: "Historia", color: "var(--hist)", quesito: false },
            { cat: "Deportes", color: "var(--dep)", quesito: true },
            { cat: "Arte y Literatura", color: "var(--arte)", quesito: false }
        ];

        const COLORES_EQUIPOS = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f"];
        let estadoJuego = { numEquipos: 2, turnoActual: 0, equipos: [] };

        function iniciarJuego() {
            const num = parseInt(document.getElementById('numEquipos').value);
            if(num < 2 || num > 4) return alert("Elige entre 2 y 4 equipos.");
            
            estadoJuego.numEquipos = num;
            estadoJuego.equipos = []; // Corrección de reinicio limpio
            
            for(let i=0; i<num; i++) {
                estadoJuego.equipos.push({
                    nombre: `Equipo ${i+1}`,
                    casillaActual: 0,
                    quesitos: { "Geografía": false, "Arte y Literatura": false, "Historia": false, "Entretenimiento": false, "Ciencia y Naturaleza": false, "Deportes": false }
                });
            }
            
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            
            renderTablero();
            renderEquipos();
            actualizarInterfazTurno();
        }

        function renderTablero() {
            const htmlTablero = document.getElementById('tablero');
            htmlTablero.innerHTML = '';
            CASILLAS.forEach((casilla, index) => {
                let fichasHtml = '';
                estadoJuego.equipos.forEach((eq, eqIndex) => {
                    if(eq.casillaActual === index) {
                        fichasHtml += `<span class="ficha-equipo" style="background:${COLORES_EQUIPOS[eqIndex]}"></span>`;
                    }
                });

                htmlTablero.innerHTML += `
                    <div class="casilla" style="background:${casilla.color}">
                        <span>${casilla.quesito ? '🏆 ' : ''}${casilla.cat}</span>
                        <div>${fichasHtml}</div>
                    </div>
                `;
            });
        }

        function renderEquipos() {
            const panel = document.getElementById('panelEquipos');
            panel.innerHTML = '';
            estadoJuego.equipos.forEach((eq, index) => {
                let quesitosHtml = '';
                Object.keys(eq.quesitos).forEach(cat => {
                    let colorCat = CASILLAS.find(c => c.cat === cat).color;
                    quesitosHtml += `<span class="quesito ${eq.quesitos[cat] ? 'obtenido' : ''}" style="background:${colorCat}" title="${cat}"></span>`;
                });

                panel.innerHTML += `
                    <div class="tarjeta-equipo" id="tarjeta-eq-${index}" style="border-left-color: ${COLORES_EQUIPOS[index]}">
                        <strong>${eq.nombre}</strong>
                        <div style="margin-top:5px;">${quesitosHtml}</div>
                    </div>
                `;
            });
        }

        function actualizarInterfazTurno() {
            document.getElementById('turnoAlerta').innerHTML = `Es el turno del <strong style="color:${COLORES_EQUIPOS[estadoJuego.turnoActual]}">${estadoJuego.equipos[estadoJuego.turnoActual].nombre}</strong>`;
            estadoJuego.equipos.forEach((_, i) => {
                document.getElementById(`tarjeta-eq-${i}`).classList.toggle('activo', i === estadoJuego.turnoActual);
            });
            document.getElementById('btnDado').disabled = false;
        }

        function lanzarDado() {
            document.getElementById('btnDado').disabled = true;
            let dado = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dadoResult').innerText = dado;

            let eq = estadoJuego.equipos[estadoJuego.turnoActual];
            eq.casillaActual = (eq.casillaActual + dado) % CASILLAS.length;

            setTimeout(() => {
                renderTablero();
                aparecerPregunta(CASILLAS[eq.casillaActual]);
            }, 1000);
        }

        function aparecerPregunta(casilla) {
