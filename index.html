<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trivial Pursuit - Digitalización</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: #fff; text-align: center; padding: 20px; }
        .box { background: #34495e; padding: 20px; border-radius: 10px; max-width: 600px; margin: 20px auto; }
        .hidden { display: none !important; }
        .tablero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .casilla { padding: 15px; border-radius: 5px; font-weight: bold; color: #000; text-align: center; }
        .btn { background: #e67e22; color: #fff; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        .opcion { display: block; width: 100%; margin: 5px 0; padding: 10px; background: #eee; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🧠 Trivial Pursuit Digitalización</h1>

    <!-- PANTALLA INICIAL -->
    <div id="pantalla-inicio" class="box">
        <h3>Configuración de Partida</h3>
        <p>Elige el número de equipos para empezar el juego:</p>
        <button class="btn" onclick="comenzarPartida()">🚀 Comenzar Partida</button>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="pantalla-juego" class="box hidden">
        <h2 id="turno">Turno: Equipo 1</h2>
        <button class="btn" onclick="tirarDado()">🎲 Tirar Dado</button>
        <h3 id="resultado-dado" style="font-size: 32px; margin: 10px 0;">?</h3>
        
        <div class="tablero">
            <div class="casilla" style="background:#1e90ff;">Geografía</div>
            <div class="casilla" style="background:#ffd700;">Historia</div>
            <div class="casilla" style="background:#32cd32;">Ciencia</div>
            <div class="casilla" style="background:#ff69b4;">Arte</div>
            <div class="casilla" style="background:#ff4500;">Deportes</div>
            <div class="casilla" style="background:#ba55d3;">Ocio</div>
        </div>
    </div>

    <!-- PREGUNTA -->
    <div id="pantalla-pregunta" class="box hidden" style="background:#fff; color:#000;">
        <h3 id="preg-categoria"></h3>
        <p id="preg-texto" style="font-size:18px; font-weight:bold;"></p>
        <div id="preg-opciones"></div>
    </div>

    <script>
        const PREGUNTAS = {
            "Geografía": { q: "¿Cuál es el río más largo del mundo?", a: ["Amazonas", "Nilo", "Danubio"], c: 0 },
            "Historia": { q: "¿En qué año se descubrió América?", a: ["1492", "1789", "1914"], c: 0 },
            "Ciencia": { q: "¿Cuál es el componente químico del agua?", a: ["H2O", "CO2", "O2"], c: 0 },
            "Arte": { q: "¿Quién pintó la Mona Lisa?", a: ["Da Vinci", "Picasso", "Velázquez"], c: 0 },
            "Deportes": { q: "¿Cuántos jugadores tiene un equipo de fútbol?", a: ["11", "7", "5"], c: 0 },
            "Ocio": { q: "¿Qué personaje vive en una piña bajo el mar?", a: ["Bob Esponja", "Patricio", "Calamardo"], c: 0 }
        };

        const CATEGORIAS = ["Geografía", "Historia", "Ciencia", "Arte", "Deportes", "Ocio"];
        let turno = 1;

        function comenzarPartida() {
            document.getElementById('pantalla-inicio').classList.add('hidden');
            document.getElementById('pantalla-juego').classList.remove('hidden');
        }

        function tirarDado() {
            let dado = Math.floor(Math.random() * 6) + 1;
            document.getElementById('resultado-dado').innerText = dado;
            
            setTimeout(() => {
                let catAleatoria = CATEGORIAS[dado - 1];
                mostrarPregunta(catAleatoria);
            }, 800);
        }

        function mostrarPregunta(categoria) {
            let datos = PREGUNTAS[categoria];
            document.getElementById('pantalla-juego').classList.add('hidden');
            document.getElementById('pantalla-pregunta').classList.remove('hidden');
            
            document.getElementById('preg-categoria').innerText = categoria.toUpperCase();
            document.getElementById('preg-texto').innerText = datos.q;
            
            let htmlOpciones = "";
            datos.a.forEach((opc, idx) => {
                htmlOpciones += `<button class="opcion" onclick="responder(${idx}, ${datos.c})">${opc}</button>`;
            });
            document.getElementById('preg-opciones').innerHTML = htmlOpciones;
        }

        function responder(elegido, correcto) {
            if (elegido === correcto) {
                alert("¡Correcto! 🎉 Sigue jugando.");
            } else {
                alert("Incorrecto... 😢 Cambio de turno.");
                turno = turno === 1 ? 2 : 1;
                document.getElementById('turno').innerText = "Turno: Equipo " + turno;
            }
            document.getElementById('pantalla-pregunta').classList.add('hidden');
            document.getElementById('pantalla-juego').classList.remove('hidden');
            document.getElementById('resultado-dado').innerText = "?";
        }
    </script>
</body>
</html>
